<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>풍운의 증표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Song+Myung&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#1b1a17; --ink2:#3a2f22; --paper:#f1ead8; --paper2:#e5dac0; --line:#b9a987;
  --text:#2a241c; --muted:#6b5f4c; --seal:#b3362b; --indigo:#2b4a6f; --gold:#c9a24f;
  --display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --body:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text)}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5}
.quest{pointer-events:auto;background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:7px 12px;max-width:min(520px,62vw);font-family:var(--ui);font-size:13px;line-height:1.45}
.quest .ch{font-family:var(--display);font-size:16px;color:var(--seal);display:block}
.quest .obj::before{content:"▸ ";color:var(--indigo)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.hb{background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:6px 10px;font-family:var(--ui);font-size:13px;white-space:nowrap}
.hb:hover{background:var(--paper)}
.hb .n{color:var(--seal);font-variant-numeric:tabular-nums;margin-left:3px}
.money{font-family:var(--ui);font-size:13px;background:rgba(241,234,216,.94);border:2px solid var(--ink2);padding:6px 10px;color:#7a5a12;font-variant-numeric:tabular-nums}

/* 대화 */
.dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 24px));background:var(--paper);border:3px solid var(--ink2);box-shadow:0 0 0 2px var(--paper) inset,0 0 0 3px var(--line) inset,0 5px 0 rgba(0,0,0,.4);padding:16px 20px 14px;z-index:20;cursor:pointer}
.dlg .nm{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:26px}
.dlg .nm b{font-family:var(--display);font-weight:400;font-size:20px}
.dlg .nm .think{font-family:var(--ui);font-size:12px;color:var(--muted)}
.dlg .orig{margin-left:auto;display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:15px;transform:rotate(-6deg);flex:none}
.dlg .tx{font-size:17.5px;line-height:1.85;min-height:3.7em;white-space:pre-wrap}
.dlg .tx.narr{color:#3d3428}
.dlg .more{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--muted);font-family:var(--ui);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chs{display:grid;gap:6px;margin-top:10px}
.chs button{text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 12px;font-size:16px;line-height:1.5}
.chs button.sel,.chs button:hover{border-color:var(--indigo);background:#e9e4d3}
.chs button .k{font-family:var(--ui);font-size:12px;color:var(--muted);margin-right:8px}

.dlg.hasp .nm{margin-left:150px}
.dlg .port{position:absolute;left:14px;bottom:calc(100% - 44px);width:136px;height:136px;object-fit:cover;border:3px solid var(--ink2);background:var(--paper2);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.cimg{display:block;width:calc(100% + 52px);max-width:none;margin:-24px -26px 16px;aspect-ratio:16/9;object-fit:cover;border-bottom:3px solid var(--ink2)}
@media (max-width:560px){.dlg .port{width:84px;height:84px;left:10px;bottom:calc(100% - 26px)}.dlg.hasp .nm{margin-left:92px}.cimg{width:calc(100% + 36px);margin:-18px -18px 12px}}
.dlg.story{background:#efe6d0}
.dlg.story .tx{color:#4a3d2c;font-style:normal}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px;text-align:left}
.route{display:grid;grid-template-columns:84px 1fr;gap:4px 12px;align-items:start;background:rgba(241,234,216,.95);border:3px solid var(--ink2);padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.4);color:var(--text)}
.route:hover,.route:focus-visible{border-color:var(--seal);transform:translateY(-2px)}
.route img{grid-row:span 2;width:84px;height:84px;object-fit:cover;border:2px solid var(--ink2)}
.route b{font-family:var(--display);font-weight:400;font-size:22px}
.route span{font-family:var(--ui);font-size:13px;line-height:1.6;color:var(--muted)}
.bt .pc img{width:96px;height:96px;object-fit:cover;border:2px solid var(--ink2);display:block;background:#d9cfb4}
.gl{margin-top:8px;padding:8px 10px;background:#e9e2cf;border-left:3px solid var(--indigo);font-family:var(--ui);font-size:14px;line-height:1.7;color:#3a3226;white-space:normal}
.gl b{font-family:var(--display);font-weight:400;color:var(--indigo);margin-right:8px;font-size:14px}
.dlg .gl{max-height:7.5em;overflow:auto}
.rec.tipr{border-left-color:var(--indigo);font-family:var(--ui);font-size:14px}
.hb.ping{animation:ping .8s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(43,74,111,.8)}100%{box-shadow:0 0 0 12px rgba(43,74,111,0)}}
.mg .seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.mg .arr{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--line);background:var(--paper2);font-size:22px;font-family:var(--ui)}
.mg .arr.ok{background:#dfe6ef;border-color:var(--indigo);color:var(--indigo)}
.mg .arr.cur{border-color:var(--seal);background:#fff3d6;transform:scale(1.12)}
.mg .cloth{position:relative;height:56px;background:repeating-linear-gradient(45deg,#f5ecd8 0 8px,#efe3c8 8px 16px);border:2px solid var(--ink2);margin-top:10px}
.mg .seam{position:absolute;left:4%;right:4%;top:50%;border-top:2px dashed #b9a987}
.mg .thread{position:absolute;left:4%;top:calc(50% - 2px);height:4px;background:repeating-linear-gradient(90deg,var(--seal) 0 10px,transparent 10px 16px);max-width:92%;transition:width .15s}
.mg .pad4{display:grid;grid-template-columns:repeat(4,56px);gap:8px;justify-content:center;margin-top:10px}
.mg .pad4 button,.mg .pad2 button{height:52px;font-size:22px;font-family:var(--ui);background:var(--paper2);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mg .pad2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mg .pad2 button{font-size:16px}
.mg .gauge{height:14px;border:2px solid var(--ink2);background:var(--paper2);margin-top:10px}
.mg .gauge i{display:block;height:100%;width:0;background:var(--indigo);transition:width .1s}
.mg .wellbox{position:relative;height:150px;margin:10px auto 0;width:140px;background:linear-gradient(#8f8a7e,#6f6a60);border:3px solid var(--ink2);border-radius:6px}
.mg .rope{position:absolute;left:50%;top:0;width:2px;background:#cbb178;height:84%}
.mg .bucket{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;font-size:30px}
.mg .pot{position:relative;width:150px;height:150px;margin:10px auto 0;border-radius:50%;background:radial-gradient(circle,#f4efe4 0 45%,#2b2622 46% 60%,#1d1813 61%);border:3px solid var(--ink2)}
.mg .ladle{position:absolute;left:50%;top:14%;width:6px;height:36%;margin-left:-3px;background:#8e6a44;transform-origin:50% 100%;transition:transform .12s}
.mg .next{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .words{display:flex;flex-wrap:wrap;align-items:center;gap:2px;justify-content:center;margin:14px 0;font-size:22px;font-family:var(--display)}
.mg .gap{min-width:26px;height:40px;border:0;background:transparent;color:#b9a987;font-size:20px;border-radius:6px}
.mg .gap:hover{background:#efe3c8}
.mg .gap.on{color:var(--seal);font-weight:700;background:#f7e2dc}
.mg .dishes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mg .dish{font-family:var(--ui);font-size:14px;background:var(--paper2);border:2px solid var(--line);padding:6px 10px}
.mg .dish.sel{border-color:var(--seal);background:#fff3d6}
.mg .table{display:grid;grid-template-columns:1fr 1fr 1fr 70px;grid-template-rows:64px 64px;gap:8px;padding:12px;background:#8e5a34;border:3px solid #5a3b22;border-radius:8px}
.mg .slot{background:#a8744a;border:2px dashed #e8d2a8;color:#fff4de;font-family:var(--ui);font-size:13px;display:grid;place-items:center;line-height:1.2}
.mg .slot b{font-weight:500;display:block}
.mg .slot i{font-style:normal;opacity:.75}
.mg .s-b1{grid-column:1;grid-row:1}.mg .s-b2{grid-column:2;grid-row:1}.mg .s-b3{grid-column:3;grid-row:1}.mg .s-f1{grid-column:1;grid-row:2}.mg .s-f2{grid-column:2/4;grid-row:2}.mg .s-s{grid-column:4;grid-row:1/3}
.mg .mgmsg{min-height:1.6em;margin-top:8px}
.lnk{background:none;border:0;color:#e3c27a;text-decoration:underline;font-family:var(--ui);font-size:12px;margin-top:6px;cursor:pointer}
.tq{display:block;font-style:normal;font-size:12.5px;opacity:.8;margin-bottom:3px;border-left:2px solid currentColor;padding-left:7px}
.mg .cloth2{position:relative;height:96px;margin-top:10px;background:var(--cl);border:2px solid var(--ink2);border-radius:4px;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.mg .cloth2 .weave{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px)}
.mg .cloth2 .seam2{position:absolute;left:5%;right:5%;top:58%;border-top:2px dashed rgba(60,40,20,.35)}
.mg .cloth2 .st{position:absolute;top:calc(58% - 3px);height:5px;background:#b23a2a;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.35);animation:stIn .18s ease-out}
.mg .cloth2 .st.out{animation:stOut .25s forwards}
@keyframes stIn{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
@keyframes stOut{to{opacity:0;transform:translateY(10px) rotate(20deg)}}
.mg .cloth2 .thr{position:absolute;top:calc(58% - 1px);height:3px;background:#b23a2a;opacity:.8;transition:left .15s,width .15s}
.mg .cloth2 .needle{position:absolute;top:calc(58% - 62px);width:9px;height:76px;margin-left:-4px;filter:drop-shadow(0 0 1px #222) drop-shadow(2px 3px 0 rgba(0,0,0,.25));transform:rotate(-28deg);transform-origin:50% 90%;transition:left .15s}
.mg .cloth2 .needle::before{content:"";position:absolute;left:1px;top:0;width:7px;height:100%;background:linear-gradient(90deg,#8d949c,#eef1f4 45%,#7d848c);border-radius:2px 2px 50% 50%/2px 2px 100% 100%}
.mg .cloth2 .needle i{position:absolute;left:3px;top:6px;width:3px;height:10px;background:var(--cl);border-radius:1px}
.mg .cloth2 .needle.dip{animation:dip .24s ease-in-out}
@keyframes dip{0%{transform:rotate(-28deg) translateY(0)}45%{transform:rotate(-8deg) translateY(22px)}100%{transform:rotate(-28deg) translateY(0)}}
.mg .cloth2 .needle.done{animation:lift .6s forwards}
@keyframes lift{to{transform:rotate(-60deg) translate(-10px,-30px);opacity:0}}
.mg .cloth2.tangle{animation:tangle .3s}
@keyframes tangle{25%{transform:translateX(-5px) rotate(-.6deg)}75%{transform:translateX(5px) rotate(.6deg)}}
.mg .cloth2.finish{box-shadow:0 0 0 4px #e3c27a,inset 0 -6px 0 rgba(0,0,0,.08);transition:box-shadow .3s}
.mg .cloth2 .spark{position:absolute;top:calc(58% - 14px);width:28px;height:28px;margin-left:-14px;border-radius:50%;pointer-events:none;opacity:0}
.mg .cloth2 .spark.on{animation:spark .35s ease-out}
@keyframes spark{0%{opacity:.9;box-shadow:0 0 0 0 rgba(255,236,170,.9)}100%{opacity:0;box-shadow:0 0 0 14px rgba(255,236,170,0)}}
.mg .sewbar{display:flex;justify-content:space-between;font-family:var(--ui);font-size:13px;margin-top:6px;min-height:1.4em}
.mg .sewbar .combo{color:var(--seal);font-weight:700}
.mg .sugi{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:14px 16px 18px;margin-top:8px;font-family:var(--display);font-size:17px;line-height:1.9}
.mg .sugi .orig{position:absolute;right:8px;top:6px}
.mg .sugi p{margin:0}
.mg .sugsign{display:inline-block;margin-top:8px;color:var(--seal);font-family:var(--ui);font-size:14px;animation:stIn .3s}
.mg .sugsign i{font-style:normal;font-family:var(--display);font-size:22px;border:2px solid var(--seal);padding:0 6px;margin-left:6px}
.mg .picks{display:grid;gap:6px;margin-top:8px}
.mg .picks.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.mg .picks button{font-family:var(--ui);font-size:14px;text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 10px;cursor:pointer}
.mg .picks button.on{border-color:var(--indigo);background:#dfe6ef}
.mg .picks button:hover{border-color:var(--indigo)}
.mg .resp{margin-top:10px;font-family:var(--ui);font-size:14px;color:var(--seal)}
.mg .brushwrap{display:flex;justify-content:center;margin-top:10px}
.mg .brush{display:grid;justify-items:center;gap:4px;background:var(--paper2);border:2px solid var(--ink2);padding:8px 18px;cursor:pointer;touch-action:none;user-select:none;font-family:var(--ui);font-size:13px}
.mg .brush svg{width:160px;height:70px}
.mg .brush .stroke{fill:none;stroke:#1d1813;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mg .route{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin:12px 0}
.mg .route .stop{display:flex;align-items:center;font-family:var(--ui);font-size:13px}
.mg .route .stop i{display:inline-block;width:18px;height:3px;background:var(--line)}
.mg .route .stop:first-child i{display:none}
.mg .route .stop b{font-weight:500;border:2px solid var(--line);background:var(--paper2);padding:3px 7px;min-width:34px;text-align:center}
.mg .route .stop.on i{background:var(--indigo)}
.mg .route .stop.on b{border-color:var(--indigo);background:#dfe6ef;color:var(--indigo)}
.mg .route .stop.cur b{border-color:var(--seal);border-style:dashed}
#mini{position:fixed;right:12px;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);background:#1b1a17;image-rendering:pixelated;display:none;pointer-events:none}
@media (max-width:560px){#mini{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px));right:10px;transform:scale(.8);transform-origin:right bottom}}
body.talking #mini{opacity:.35}
.mg .psg{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:10px 40px 10px 12px;margin:8px 0;font-family:var(--display);font-size:16.5px;line-height:1.9;max-height:12em;overflow:auto}
.mg .psg .orig,.mg .sugi .orig{position:absolute;right:8px;top:6px;display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:13px;transform:rotate(-6deg)}
.mg .psg .hit{background:#dfe6ef;color:var(--indigo);font-weight:700;border-radius:3px;padding:0 2px}
.histlnk{margin-left:auto;font-family:var(--ui);font-size:12px;background:transparent;border:1.5px solid var(--line);padding:2px 8px;color:var(--muted)}
.histlnk:hover{border-color:var(--indigo);color:var(--indigo)}
.dlg .orig+.histlnk{margin-left:8px}
#hist{z-index:90}
#hist .rec.plain{border-left-color:var(--line);color:#4a3d2c}
#hist .seal-s{width:18px;height:18px;font-size:10px;vertical-align:middle}
.mg .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.mg .cards button{display:grid;gap:2px;text-align:left;background:#6d4b2c;color:#f1ead8;border:2px solid var(--ink2);padding:10px;min-height:70px;font-family:var(--ui);font-size:13px}
.mg .cards button b{font-family:var(--display);font-weight:400;font-size:17px}
.mg .cards button.on{background:#f7f0dc;color:var(--text);border-color:var(--gold);animation:stIn .25s}
.mg .cards button.on span{color:var(--muted)}
.mg .picks button:disabled{opacity:.6;cursor:default}
.ek{font-weight:700;color:#2a1d10;background:linear-gradient(transparent 58%,rgba(242,201,76,.6) 58%);padding:0 1px}
.eb2{font-weight:700;color:var(--seal)}
.alias{font-family:var(--ui);font-size:12.5px;color:var(--muted)}
.mg .arena{position:relative;height:90px;margin-top:10px;background:linear-gradient(#8a9a5a,#6f7f48);border:2px solid var(--ink2);overflow:hidden}
.mg .arena .zone{position:absolute;top:0;bottom:0;width:13%;background:rgba(179,54,43,.28);border-left:2px dashed var(--seal);border-right:2px dashed var(--seal)}
.mg .arena .zl{left:30%}.mg .arena .zr{right:30%}
.mg .arena .ballc{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#f5cd4f 40%,#b3800f);box-shadow:0 0 16px 4px rgba(255,222,120,.7)}
.mg .arena .ballc.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.mg .arena .tg{position:absolute;top:22px;font-size:40px;line-height:1}
.mg .belly{position:relative;height:110px;margin-top:10px;border-radius:50px;background:radial-gradient(ellipse at center,#6b1f1a,#3a0f0c 70%);border:3px solid #1d1813;overflow:hidden}
.mg .belly .organ{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#f5cd4f 40%,#b3800f);box-shadow:0 0 18px 6px rgba(255,222,120,.6)}
.mg .belly .gauge2{position:absolute;left:12px;right:12px;bottom:10px;height:10px;background:rgba(0,0,0,.35);border:1px solid #f1ead8}
.mg .belly .gauge2 i{display:block;height:100%;width:0;background:#f2c94c;transition:width .15s}
.mg .belly .bl{position:absolute;left:14px;bottom:22px;color:#f1ead8;font-family:var(--ui);font-size:12px}
.mg .scrolls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.mg .scrolls figure{margin:0;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .scrolls svg{width:100%;max-width:170px}
.sheet.itemget{text-align:center;position:relative;overflow:hidden}
.itemget>*:not(.rays){position:relative}
.itemget .itimg{display:block;margin:6px auto 10px;width:min(240px,58vw);border-radius:8px;border:3px solid #8a6a1f;box-shadow:0 0 40px 8px rgba(255,210,110,.6);animation:itrise .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes itrise{from{transform:translateY(50px) scale(.5);opacity:0}}
.itemget .rays{position:absolute;left:50%;top:140px;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(rgba(255,215,120,.22) 0 9deg,transparent 9deg 18deg);border-radius:50%;animation:itspin 14s linear infinite;pointer-events:none}
@keyframes itspin{to{transform:rotate(360deg)}}
.thumb{float:right;width:52px;height:52px;object-fit:cover;border:2px solid var(--line);border-radius:4px;margin-left:6px}
.mg .unroll{overflow:hidden;animation:unroll 1.1s ease-out both;border:2px solid #6d4b2c}
.mg .unroll img{display:block;width:100%}
.mg .scrolls figure:nth-child(2) .unroll{animation-delay:1s}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.mg .backwrap{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-top:8px}
.mg .back{width:100%;max-width:320px;background:#f7f0dc;border:2px solid var(--ink2)}

function blocked(x,y,self){
  const m=G.map;if(x<0||y<0||x>=m.w||y>=m.h)return true;
  if(SOLID.has(tileAt(m,x,y)))return true;
  for(const o of m.objs){if(o.pass||(o.hide&&o.hide()))continue;if(o.k==="door"&&G.f.gateOpen)continue;
    if(x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h)return true}
  for(const n of m.npcs){if(n===self||!visible(n))continue;if(n.tx===x&&n.ty===y)return true;if(n.moving&&n.nx===x&&n.ny===y)return true}
  const p=G.player;if(!G.demo&&self!==p&&((p.tx===x&&p.ty===y)||(p.moving&&p.nx===x&&p.ny===y)))return true;

const keys={};let keyOrder=[];
const KMAP={ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down",ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right"};

addEventListener("keydown",e=>{
  const k=KMAP[e.code];
  if(k){keys[k]=true;keyOrder=keyOrder.filter(x=>x!==k);keyOrder.push(k);if(!UI.modal){e.preventDefault();nudge(k)}}
  if(e.repeat)return;
  if(e.code==="KeyE"||e.code==="Space"||e.code==="Enter"||e.code==="KeyZ"){
    if(UI.onKey&&UI.onKey(e)){e.preventDefault();return}
    if(G.battle&&!UI.modal){e.preventDefault();G.battle.attack();return}
    if(!UI.modal&&!G.busy&&!G.demo){e.preventDefault();interact()}
  }else if(UI.onKey){UI.onKey(e)}
  if(e.code==="Escape"&&UI.panel)closePanel();
});
addEventListener("keyup",e=>{const k=KMAP[e.code];if(k){keys[k]=false;keyOrder=keyOrder.filter(x=>x!==k)}});

  const on=e=>{e.preventDefault();keys[k]=true;keyOrder=keyOrder.filter(x=>x!==k);keyOrder.push(k);nudge(k)};
  const off=e=>{e.preventDefault();keys[k]=false;keyOrder=keyOrder.filter(x=>x!==k)};
  b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off)});

function interact(){
  const p=G.player;if(p.moving||G.lock)return;const [dx,dy]=DIRV[p.dir];const x=p.tx+dx,y=p.ty+dy;
  const n=G.map.npcs.find(n=>visible(n)&&n.tx===x&&n.ty===y);
  if(n&&n.talk){if(n.look!=="chicken")n.dir=OPP[p.dir];run(()=>n.talk(n));return}
  const o=G.map.objs.find(o=>o.use&&!(o.hide&&o.hide())&&x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h);
  if(o){run(()=>o.use(o));return}
}

  if(blocked(nx,ny,ent))return false;ent.moving=true;ent.prog=0;ent.nx=nx;ent.ny=ny;ent.step++;if(ent===G.player&&ent.step%2)sfx(ent.look==="bell"?"jingle":ent.mount?"clop":"step");else if(ent.look==="bell"&&ent.step%2&&!G.demo&&Math.abs(ent.tx-G.player.tx)+Math.abs(ent.ty-G.player.ty)<9)sfx("jingle");
  if(ent.look!=="chicken"&&!G.night&&Math.random()<(ent===G.player?0.9:0.4))for(let k=0;k<2;k++)addPart({k:"dust",x:ent.tx*T+8+(Math.random()*6-3),y:ent.ty*T+15,vx:-dx*6+(Math.random()*8-4),vy:-4-Math.random()*4,life:0.45});
  return true;
}

    if(p.k==="fly"){p.x+=Math.sin(p.age*1.7+p.ph)*8*dt;p.y+=Math.cos(p.age*1.3+p.ph)*6*dt}

    const press=()=>{if(!alive)return;

function orderPuzzle(title,ev){

/* 머리채를 잡고 치는 장면: 원문 그대로 '휘휘 칭칭', '이리 치고', '저리 치며' */

const EMPH_K=window.EMPH_K_G||[];
const EMPH_B=window.EMPH_B_G||[];
function emphSegs(s){
  const mark=new Array(s.length).fill(0);
  const put=(list,v)=>{for(const w of [...list].sort((a,b)=>b.length-a.length)){let k=s.indexOf(w);while(k>=0){if(!mark.slice(k,k+w.length).some(Boolean))for(let j=k;j<k+w.length;j++)mark[j]=v;k=s.indexOf(w,k+w.length)}}};
  put(EMPH_K,1);put(EMPH_B,2);
  const segs=[];let cur=null;for(let j=0;j<s.length;j++){if(!cur||cur.c!==mark[j]){cur={t:"",c:mark[j]};segs.push(cur)}cur.t+=s[j]}
  return segs.map(x=>({t:[...x.t],c:x.c}));
}
function segHTML(segs,n){let out="",left=n;
  for(const x of segs){if(left<=0)break;const part=x.t.slice(0,left).join("");left-=x.t.length;
    out+=x.c===1?`<b class="ek">${esc(part)}</b>`:x.c===2?`<b class="eb2">${esc(part)}</b>`:esc(part)}
  return out}

  ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(cx,sy+14,r*0.95,2.2,0,0,Math.PI*2);ctx.fill();
  const gl=ctx.createRadialGradient(cx,cy,r*0.4,cx,cy,r*2.8);gl.addColorStop(0,"rgba(255,222,120,"+(0.4+0.1*Math.sin(t*4))+")");gl.addColorStop(1,"rgba(255,222,120,0)");ctx.fillStyle=gl;ctx.fillRect(cx-r*3,cy-r*3,r*6,r*6);
  ctx.fillStyle="#5a3d0c";ctx.beginPath();ctx.arc(cx,cy,r+0.8,0,Math.PI*2);ctx.fill();
  const b=ctx.createRadialGradient(cx-r*0.35,cy-r*0.45,r*0.15,cx,cy,r);b.addColorStop(0,"#fff7cf");b.addColorStop(0.35,"#f5cd4f");b.addColorStop(1,"#b3800f");ctx.fillStyle=b;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  const [wx]=entPos(e),ang=wx/(r*1.1);ctx.strokeStyle="rgba(90,61,12,.85)";ctx.lineWidth=0.9;
  ctx.beginPath();ctx.ellipse(cx,cy,Math.abs(Math.cos(ang))*r*0.92+0.3,r*0.92,0,-Math.PI/2,Math.PI/2);ctx.stroke();
  ctx.fillStyle="#5a3d0c";ctx.fillRect(Math.round(cx+Math.sin(ang)*r*0.55)-1,Math.round(cy+r*0.35),2,2);
  const sp=(t*1.3+(e.ph||0))%3;if(sp<0.5){ctx.fillStyle="#ffffff";ctx.fillRect(Math.round(cx+r*1.3*Math.cos(sp*9)),Math.round(cy-r*1.2+sp*3),1,1)}
  return cy-r-3;
}

function stitchGame(len,title,col){
  return new Promise(res=>{
    const seq=Array.from({length:len},()=>"udlr"[Math.floor(Math.random()*4)]);let i=0,combo=0;
    const X=k=>6+k*(88/len),SW=88/len;
    const v=mgOpen(`<span class="eb">삯바느질 · 땀 뜨기</span><h2>${esc(title)}</h2><p class="note">화살표가 가리키는 방향키(또는 아래 버튼)를 순서대로 눌러 한 땀씩 꿰매요. 틀리면 실이 엉켜 한 땀 풀려요.</p>
      <div class="cloth2" style="--cl:${col||"#efe3c8"}"><div class="weave"></div><div class="seam2"></div><div class="stitches"></div><div class="thr"></div><div class="needle"><i></i></div><div class="spark"></div></div>
      <div class="sewbar"><span class="combo"></span><span class="cnt"></span></div><div class="seq"></div>${PAD4}`);
    const cl=v.querySelector(".cloth2"),st=v.querySelector(".stitches"),nd=v.querySelector(".needle"),th=v.querySelector(".thr");
    const place=()=>{const x=X(i);nd.style.left=x+"%";th.style.left=(i?X(i-1)+SW*0.6:X(0))+"%";th.style.width=Math.max(0,x-(i?X(i-1)+SW*0.6:X(0)))+"%"};
    const paint=()=>{v.querySelector(".seq").innerHTML=seq.map((a,k)=>`<span class="arr${k<i?" ok":k===i?" cur":""}">${ARG[a]}</span>`).join("");
      v.querySelector(".cnt").textContent=`${i} / ${len} 땀`;v.querySelector(".combo").textContent=combo>=3?`손놀림이 척척! ×${combo}`:"";place()};
    const hit=a=>{
      if(i>=len)return;
      if(a===seq[i]){
        const s=document.createElement("span");s.className="st";s.style.left=X(i)+"%";s.style.width=SW*0.6+"%";st.appendChild(s);
        nd.classList.remove("dip");void nd.offsetWidth;nd.classList.add("dip");
        const sp=v.querySelector(".spark");sp.style.left=X(i)+SW*0.3+"%";sp.classList.remove("on");void sp.offsetWidth;sp.classList.add("on");
        i++;combo++;paint();sfx("stitch");
        if(i>=len){sfx("correct");nd.classList.add("done");cl.classList.add("finish");setTimeout(()=>{mgClose(v);res()},800)}
      }else{
        sfx("wrong");combo=0;cl.classList.remove("tangle");void cl.offsetWidth;cl.classList.add("tangle");
        if(i>0){const last=st.lastElementChild;if(last){last.classList.add("out");setTimeout(()=>last.remove(),250)}i--}
        paint();
      }};
    paint();v.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)hit(b.dataset.a)});
    UI.onKey=e=>{const a=ARR[e.code];if(a){hit(a);return true}return true};
  });
}
/* 두레박 당기기: ←→ 번갈아 */
function pullGame(title){
  return new Promise(res=>{
    let g=0,last="",alive=true;
    const v=mgOpen(`<span class="eb">물 긷기 · 두레박 당기기</span><h2>${esc(title)}</h2><p class="note">← → 방향키(또는 아래 두 버튼)를 번갈아 빠르게 눌러 두레박을 끌어올려요. 손을 멈추면 두레박이 다시 내려가요.</p>
      <div class="wellbox"><div class="rope"></div><div class="bucket">🪣</div></div><div class="gauge"><i></i></div><div class="pad2"><button data-a="l">← 왼손</button><button data-a="r">오른손 →</button></div>`);
    const bucket=v.querySelector(".bucket"),bar=v.querySelector(".gauge i"),rope=v.querySelector(".rope");
    const paint=()=>{bar.style.width=g+"%";bucket.style.bottom=(8+g*0.78)+"%";rope.style.height=(84-g*0.78)+"%"};
    const hit=a=>{if(!alive)return;if(a!=="l"&&a!=="r")return;if(a!==last){g=Math.min(100,g+6);last=a;sfx("pull")}else{g=Math.max(0,g-2);shk(v.querySelector(".wellbox"))}paint();if(g>=100){alive=false;sfx("splash");setTimeout(()=>{mgClose(v);res()},400)}};
    let lt=performance.now();const tick=now=>{if(!alive)return;const dt=(now-lt)/1000;lt=now;g=Math.max(0,g-dt*9);paint();requestAnimationFrame(tick)};requestAnimationFrame(tick);
    v.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)hit(b.dataset.a)});
    UI.onKey=e=>{const a=ARR[e.code];if(a){hit(a);return true}return true};
  });
}
/* 죽 젓기: ↑→↓← 빙글빙글 */
function stirGame(title){

  if(hit){back=[hit.tx,hit.ty,hit.dir];G.flash=0;setNear(hit,[[target.tx-1,target.ty],[target.tx+1,target.ty],[target.tx-1,target.ty+1],[target.tx+1,target.ty+1]]);hit.dir=hit.tx<target.tx?"r":"l";hit.fixed=1;await sleep(250)}

    const t0=performance.now()/1000;FX.push({k:"paddle",e:target,t0,dur:0.42,count:(opt.from||0)+i+1,tool:opt.tool});
    await sleep(210);sfx(opt.sfx||"whack");G.shake=Math.max(G.shake||0,opt.hard?5:3.5);target.hurt=0.35;
    FX.push({k:"hit",e:target,t0:performance.now()/1000,dur:0.5,count:(opt.from||0)+i+1});

function drawFX(t){
  const cx=G.cam.x,cy=G.cam.y;
  for(let i=FX.length-1;i>=0;i--){const f=FX[i],p=(t-f.t0)/f.dur;if(p>1.2){FX.splice(i,1);continue}if(p<0)continue;

function holdList(e){return !e||!e.hold?[]:Array.isArray(e.hold)?e.hold:[e.hold]}
function holdAdd(e,id){const a=holdList(e).filter(x=>x!==id);a.push(id);e.hold=a;if(e===G.player)paintBag()}
function holdDel(e,id){const a=holdList(e).filter(x=>x!==id);e.hold=a.length?a:null;if(e===G.player)paintBag()}
function holdSet(e,v){e.hold=v||null;if(e===G.player)paintBag()}
function drawHeldIcon(id,x,y,t){const h=HELD[id];if(h)h.d(Math.round(x),Math.round(y),t)}
/* 인물 그림 위에 손에 든 것을 덧그림 (engine draw 에서 부름) */
function drawHeld(e,sx,sy,topY,t){
  const a=holdList(e);if(!a.length)return;
  const bob=e.moving?Math.round(Math.abs(Math.sin((e.step+e.prog)*Math.PI))):0;
  let hand=0,over=0;const nOver=Math.max(0,a.filter(id=>!(HELD[id]||{}).pos).length-(e.look==="bell"?0:2));
  for(const id of a){const h=HELD[id];if(!h)continue;
    if(h.pos==="neck"){h.d(sx+8,Math.round(topY+15),t);continue}
    if(e.down)continue;

    const t=document.createElement("canvas");t.width=w;t.height=h;const tg=t.getContext("2d"),td=tg.createImageData(w,h),ta=td.data;

    ITEMPIC[id]=o;for(const al of (PICALIAS[id]||[]))ITEMPIC[al]=o});
